<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Jeong Yumin — Planning Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff;
    --accent: #ff3901;
    --panel: #f3f1ee;
    --sans: "Inter Tight", "Helvetica Neue", sans-serif;
    --serif: "Instrument Serif", "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--accent); font-family: var(--sans); }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }

  /* top bar: keywords left / right, name logo center */
  .menu {
    position: fixed; top: 0; left: 0; width: 100vw; z-index: 4;
    display: flex; justify-content: space-between;
  }
  .menu ul { display: flex; }
  .menu li { padding: 20px 30px; font-size: 26px; }
  .menu-right { margin-top: 5px; }

  .logo { position: fixed; left: 50vw; transform: translateX(-50%); z-index: 3; }
  .logo svg { display: block; width: 100%; height: auto; }
  .logo text { font-family: var(--serif); fill: var(--accent); }
  .logo-top { top: 26px; width: 15vw; }
  .logo-bottom { bottom: 21px; width: 21vw; }

  /* project slider */
  .slider {
    position: fixed; top: 150px; bottom: 175px; left: 0; right: 0;
    display: flex; gap: 20px;
    padding: 0 calc(50vw - (100vh - 325px) * 3 / 8); /* first & last slide can sit centered */
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    cursor: grab; user-select: none;
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider.dragging { cursor: grabbing; scroll-snap-type: none; }
  .slide {
    flex: 0 0 auto; height: 100%; aspect-ratio: 3 / 4; max-width: 50vw;
    scroll-snap-align: center;
    position: relative; background: var(--panel); overflow: hidden;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; pointer-events: none; }
  .slide .num {
    position: absolute; top: 24px; left: 26px;
    font-family: var(--serif); font-size: 120px; line-height: .8;
  }
  .slide .cap {
    position: absolute; left: 26px; right: 26px; bottom: 24px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 18px; line-height: 1.35;
  }
  .slide .cap small { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }

  .arrow {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 2;
    padding: 30px; background: none; border: 0; cursor: pointer;
    font: 40px/1 var(--sans); color: var(--accent);
  }
  .arrow.prev { left: 0; }
  .arrow.next { right: 0; }


  /* big nav bottom-left, highlight bar on hover */
  .home-menu { position: fixed; bottom: 23px; left: 32px; z-index: 2; }
  .home-menu li { position: relative; padding: 5.3px 0; display: table; }
  .home-menu li::after {
    content: ""; position: absolute; left: 0; top: calc(50% + 4px); transform: translateY(-50%);
    height: .4vw; width: 0; background: var(--accent);
    transition: width .3s ease-in-out; pointer-events: none;
  }
  .home-menu li:hover::after { width: calc(100% + .8vw); transition-duration: .5s; }
  .home-menu a { font-size: 4vw; line-height: 1; }

  .footer-menu { position: fixed; bottom: 30px; right: 30px; }
  .footer-menu ul { display: flex; align-items: flex-end; }
  .footer-menu li { padding: 0 5px; font-size: 20px; }
  .footer-menu li:last-child { padding-right: 0; }
  .footer-menu a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .lang::before {
    content: ""; display: inline-block; width: 2px; height: 15px; margin: -2px 10px 0 5px;
    background: var(--accent); vertical-align: middle;
  }
</style>
</head>
<body>

<header class="menu">
  <ul class="menu-left">
    <li>Planning</li>
    <li>Research</li>
    <li>Strategy</li>
  </ul>
  <ul class="menu-right">
    <li>Content</li>
    <li>UX</li>
  </ul>
</header>

<!-- 이름 로고: textLength로 폭을 고정해 상단 15vw / 하단 21vw 비율 유지 -->
<a class="logo logo-top" href="#" aria-label="Jeong Yumin">
  <svg viewBox="0 0 700 215"><text x="0" y="168" font-size="214" textLength="700" lengthAdjust="spacingAndGlyphs">JEONG</text></svg>
</a>
<a class="logo logo-bottom" href="#" aria-hidden="true" tabindex="-1">
  <svg viewBox="0 0 960 240"><text x="0" y="200" font-size="256" textLength="960" lengthAdjust="spacingAndGlyphs">YUMIN</text></svg>
</a>

<!-- 프로젝트 슬라이드: 실제 프로젝트 확정 후 제목·이미지 교체 (<img src> 넣으면 회색 패널 대신 표시) -->
<div class="slider" id="slider">
  <a class="slide" href="#work"><span class="num">01</span><div class="cap"><span>Service Planning</span><small>Project</small></div></a>
  <a class="slide" href="#work"><span class="num">02</span><div class="cap"><span>User Research</span><small>Project</small></div></a>
  <a class="slide" href="#work"><span class="num">03</span><div class="cap"><span>Content Strategy</span><small>Project</small></div></a>
  <a class="slide" href="#work"><span class="num">04</span><div class="cap"><span>Information Architecture</span><small>Project</small></div></a>
  <a class="slide" href="#work"><span class="num">05</span><div class="cap"><span>UX Proposal</span><small>Project</small></div></a>
</div>
<button class="arrow prev" aria-label="Previous">←</button>
<button class="arrow next" aria-label="Next">→</button>

<nav class="home-menu" aria-label="Main">
  <ul>
    <li><a href="#work">WORK</a></li>
    <li><a href="#about">ABOUT</a></li>
    <li><a href="#archive">ARCHIVE</a></li>
    <li><a href="#contact">CONTACT</a></li>
  </ul>
</nav>

<div class="footer-menu">
  <ul>
    <li><a href="#">(NOTION)</a></li>
    <li><a href="mailto:">(EMAIL)</a></li>
    <li><a href="#">(RESUME)</a></li>
    <li class="lang">(KOR)</li>
  </ul>
</div>

<script>
  const s = document.getElementById('slider');
  const slides = [...s.children];
  const step = () => slides[0].offsetWidth + 20;

  document.querySelector('.prev').onclick = () => s.scrollBy({ left: -step(), behavior: 'smooth' });
  document.querySelector('.next').onclick = () => s.scrollBy({ left: step(), behavior: 'smooth' });


  // drag to scroll; suppress click if it was a drag
  let x0, left0, moved = false;
  s.addEventListener('pointerdown', e => { x0 = e.clientX; left0 = s.scrollLeft; moved = false; s.setPointerCapture(e.pointerId); });
  s.addEventListener('pointermove', e => {
    if (x0 == null) return;
    if (Math.abs(e.clientX - x0) > 4) { moved = true; s.classList.add('dragging'); }
    if (moved) s.scrollLeft = left0 - (e.clientX - x0);
  });
  const end = () => { x0 = null; s.classList.remove('dragging'); };
  s.addEventListener('pointerup', end);
  s.addEventListener('pointercancel', end);
  s.addEventListener('click', e => { if (moved) e.preventDefault(); }, true);
</script>
</body>
</html>
